<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード生成</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f3f3;
    font-family:"Yu Gothic",sans-serif;
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
    margin:20px 0;
}

button{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:10px;
    cursor:pointer;
}

#qrcode{
    margin-top:20px;
    display:flex;
    justify-content:center;
}

#error{
    color:red;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>QRコード生成</h1>

<input
id="url"
type="text"
placeholder="https://example.com">

<button onclick="generateQR()">生成</button>

<button onclick="downloadQR()">ダウンロード</button>

<div id="error"></div>

<div id="qrcode"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let currentQR = null;

function validURL(str){
    try{
        const url = new URL(str);
        return url.protocol==="http:" || url.protocol==="https:";
    }catch{
        return false;
    }
}

function generateQR(){

    const url=document.getElementById("url").value.trim();
    const area=document.getElementById("qrcode");
    const error=document.getElementById("error");

    area.innerHTML="";
    error.textContent="";

    if(!validURL(url)){
        error.textContent="正しいURLを入力してください。";
        return;
    }

    currentQR=new QRCode(area,{
        text:url,
        width:220,
        height:220,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.H
    });

}

function downloadQR(){

    const img=document.querySelector("#qrcode img");
    const canvas=document.querySelector("#qrcode canvas");

    if(img){
        const a=document.createElement("a");
        a.href=img.src;
        a.download="QRCode.png";
        a.click();
        return;
    }

    if(canvas){
        const a=document.createElement("a");
        a.href=canvas.toDataURL("image/png");
        a.download="QRCode.png";
        a.click();
        return;
    }

    alert("先にQRコードを生成してください。")

}

</script>

</body>
</html>
