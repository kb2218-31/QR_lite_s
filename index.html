<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード生成</title>

<style>
body{
    margin:40px;
    font-family:"Yu Gothic",sans-serif;
    background:#ffffff;
    color:#222;
}

h1{
    margin-bottom:20px;
    font-size:28px;
}

input,
select,
button{
    width:100%;
    max-width:500px;
    padding:10px;
    font-size:16px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.option{
    display:block;
    margin:10px 0;
    text-align:left;
}

.option input{
    width:auto;
    margin-right:6px;
}

label{
    display:block;
    max-width:500px;
    margin:12px 0 6px;
    font-weight:bold;
}

#qrcode{
    margin-top:25px;
}

#qrText{
    margin-top:15px;
    word-break:break-all;
}

#error{
    color:red;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>QRコード生成簡易サイト</h1>

<input
id="url"
type="text"
placeholder="https://example.com">

<label for="fileName">保存ファイル名</label>
<input
id="fileName"
type="text"
placeholder="例：Example QR">

<button onclick="generateQR()">生成</button>

<label for="includeText">URL表示</label>
<select id="includeText">
    <option value="show">表示する</option>
    <option value="hide">表示しない</option>
</select>

<label for="downloadType">保存形式</label>
<select id="downloadType">
    <option value="png">PNG形式で保存</option>
    <option value="pdf">PDF形式で保存</option>
</select>

<button onclick="downloadQR()">ダウンロード</button>

<div id="error"></div>

<div id="qrcode"></div>
<div id="qrText"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</div>
<script>
    

let currentQR = null;

function validURL(str){
    try{
        const url = new URL(str);
        return url.protocol==="http:" || url.protocol==="https:";
    }catch{
        return false;
    }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){

    const chars = text.split("");
    let line = "";

    for(let i=0;i<chars.length;i++){

        const testLine = line + chars[i];

        if(ctx.measureText(testLine).width > maxWidth && line !== ""){
            ctx.fillText(line,x,y);
            line = chars[i];
            y += lineHeight;
        }else{
            line = testLine;
        }
    }

    ctx.fillText(line,x,y);
}

function generateQR(){

    const url = document.getElementById("url").value.trim();
    const area = document.getElementById("qrcode");
    const error = document.getElementById("error");
    const qrText = document.getElementById("qrText");

    area.innerHTML = "";
    error.textContent = "";
    qrText.textContent = "";

    if(!validURL(url)){
        error.textContent = "正しいURLを入力してください。";
        return;
    }

    currentQR = new QRCode(area,{
        text:url,
        width:220,
        height:220,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.H
    });

    qrText.textContent = url;
}

async function downloadQR(){

    const img = document.querySelector("#qrcode img");
    const canvas = document.querySelector("#qrcode canvas");

    if(!img && !canvas){
        alert("先にQRコードを生成してください。");
        return;
    }

    const src = img ? img.src : canvas.toDataURL("image/png");

    const image = new Image();

image.onload = function(){

    // 各種設定
    const margin = 35;
    const lineHeight = 20;
    const url = document.getElementById("url").value.trim();
    const includeText = document.getElementById("includeText").value === "show";
    const saveName = document.getElementById("fileName").value.trim() || "QRCode";

    // 文字数計算用キャンバス
    const tempCanvas = document.createElement("canvas");
    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.font = "16px Yu Gothic";

    let line = "";
    let lineCount = 1;

    for(const ch of url){

        const testLine = line + ch;

        if(tempCtx.measureText(testLine).width > image.width + margin * 2 - 20){
            lineCount++;
            line = ch;
        }else{
            line = testLine;
        }

    }

    const textHeight = includeText ? lineCount * lineHeight + 20 : 0;

    // 出力用キャンバス
    const outCanvas = document.createElement("canvas");
    outCanvas.width = image.width + margin * 2;
    outCanvas.height = image.height + margin * 2 + textHeight;

    const ctx = outCanvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);

    // QRコード描画
    ctx.drawImage(image, margin, margin);

    // URL表示
    if(includeText){

        ctx.fillStyle = "#000000";
        ctx.font = "16px Yu Gothic";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        wrapText(
            ctx,
            url,
            outCanvas.width / 2,
            image.height + margin * 2 + 8,
            outCanvas.width - 20,
            lineHeight
        );
    }

    // 保存形式
    const type = document.getElementById("downloadType").value;

    if(type === "png"){

        const a = document.createElement("a");
        a.href = outCanvas.toDataURL("image/png");
        a.download = saveName + ".png";
        a.click();

    }else{

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });

        const pdfWidth = 70;
        const pdfHeight = pdfWidth * outCanvas.height / outCanvas.width;

        pdf.addImage(
            outCanvas.toDataURL("image/png"),
            "PNG",
            70,
            40,
            pdfWidth,
            pdfHeight
        );

        pdf.save(saveName + ".pdf");
    }

};

    image.src = src;

}

</script>

</body>
</html>
