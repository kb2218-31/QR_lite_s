<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコード生成</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f3f3;
    font-family:"Yu Gothic",sans-serif;
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
    margin:20px 0;
}

button{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:10px;
    cursor:pointer;
}

select{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:10px;
    box-sizing:border-box;
}

#qrcode{
    margin-top:20px;
    display:flex;
    justify-content:center;
}

#qrText{
    margin-top:15px;
    font-size:14px;
    color:#333;
    word-break:break-all;
    text-align:center;
}

#error{
    color:red;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>QRコード生成簡易サイト</h1>

<input
id="url"
type="text"
placeholder="https://example.com">

<button onclick="generateQR()">生成</button>

<select id="downloadType">
    <option value="png">PNG形式で保存</option>
    <option value="pdf">PDF形式で保存</option>
</select>

<button onclick="downloadQR()">ダウンロード</button>

<div id="error"></div>

<div id="qrcode"></div>
<div id="qrText"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let currentQR = null;

function validURL(str){
    try{
        const url = new URL(str);
        return url.protocol==="http:" || url.protocol==="https:";
    }catch{
        return false;
    }
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){

    const chars = text.split("");
    let line = "";

    for(let i=0;i<chars.length;i++){

        const testLine = line + chars[i];

        if(ctx.measureText(testLine).width > maxWidth && line !== ""){
            ctx.fillText(line,x,y);
            line = chars[i];
            y += lineHeight;
        }else{
            line = testLine;
        }
    }

    ctx.fillText(line,x,y);
}

function generateQR(){

    const url = document.getElementById("url").value.trim();
    const area = document.getElementById("qrcode");
    const error = document.getElementById("error");
    const qrText = document.getElementById("qrText");

    area.innerHTML = "";
    error.textContent = "";
    qrText.textContent = "";

    if(!validURL(url)){
        error.textContent = "正しいURLを入力してください。";
        return;
    }

    currentQR = new QRCode(area,{
        text:url,
        width:220,
        height:220,
        colorDark:"#000000",
        colorLight:"#ffffff",
        correctLevel:QRCode.CorrectLevel.H
    });

    qrText.textContent = url;
}

async function downloadQR(){

    const img = document.querySelector("#qrcode img");
    const canvas = document.querySelector("#qrcode canvas");

    if(!img && !canvas){
        alert("先にQRコードを生成してください。");
        return;
    }

    const src = img ? img.src : canvas.toDataURL("image/png");

    const image = new Image();

    image.onload = function(){

        const margin = 35;
        const lineHeight = 20;
        const url = document.getElementById("url").value.trim();

        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCtx.font = "16px Yu Gothic";

        let line = "";
        let lineCount = 1;

        for(const ch of url){

            const testLine = line + ch;

            if(tempCtx.measureText(testLine).width > image.width + margin*2 - 20){
                lineCount++;
                line = ch;
            }else{
                line = testLine;
            }

        }

        const textHeight = lineCount * lineHeight + 20;

        const outCanvas = document.createElement("canvas");
        outCanvas.width = image.width + margin*2;
        outCanvas.height = image.height + margin*2 + textHeight;

        const ctx = outCanvas.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,outCanvas.width,outCanvas.height);

        ctx.drawImage(image,margin,margin);

        ctx.fillStyle = "#000000";
        ctx.font = "16px Yu Gothic";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        wrapText(
            ctx,
            url,
            outCanvas.width/2,
            image.height + margin*2 + 8,
            outCanvas.width - 20,
            lineHeight
        );

        const type = document.getElementById("downloadType").value;

        if(type==="png"){

            const a = document.createElement("a");
            a.href = outCanvas.toDataURL("image/png");
            a.download = "QRCode.png";
            a.click();

        }else{

            const { jsPDF } = window.jspdf;

            const pdf = new jsPDF({
                orientation:"portrait",
                unit:"mm",
                format:"a4"
            });

            const pdfWidth = 70;
            const pdfHeight = pdfWidth * outCanvas.height / outCanvas.width;

            pdf.addImage(
                outCanvas.toDataURL("image/png"),
                "PNG",
                70,
                40,
                pdfWidth,
                pdfHeight
            );

            pdf.save("QRCode.pdf");

        }

    };

    image.src = src;

}

</script>

</body>
</html>
